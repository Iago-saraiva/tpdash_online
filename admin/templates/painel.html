<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TP DASH ADMIN</title>
  <link rel="icon" href="{{ base() }}/favicon.ico">
  <link rel="stylesheet" href="{{ base() }}/static/app.css"><link rel="stylesheet" href="{{ base() }}/static/admin.css">
  {% for c in css %}<link rel="stylesheet" href="{{ base() }}/static/{{ c }}">{% endfor %}
</head>
<body>
<header class="adm-topo">
  <img src="{{ base() }}/static/logo-tpdash-preto.svg" width="30" height="30" alt="" class="logo-tpdash">
  <h1>TP DASH ADMIN</h1><span class="selo">Tecnoplan</span>
  <span class="esp"></span>
  <span class="quem">{{ usuario.nome }}</span> · <a href="{{ base() }}/trocar-senha">Trocar senha</a> · <a href="{{ base() }}/sair">Sair</a>

<main class="conteudo" id="raiz" data-base="{{ base() }}" data-token="{{ csrf_token() }}"></main>

<script type="module" src="{{ base() }}/static/{{ js }}"></script>
