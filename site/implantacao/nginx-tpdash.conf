# /etc/nginx/sites-available/tpdash  (troque painel.exemplo.com.br pelo domínio)
# O certificado HTTPS é criado pelo certbot: sudo certbot --nginx -d painel.exemplo.com.br
server {
    listen 80;
    server_name painel.exemplo.com.br;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name painel.exemplo.com.br;
    client_max_body_size 64m;          # respostas grandes dos agentes (já vêm compactadas)

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 200s;       # consultas longas e a espera dos agentes
    }
}
